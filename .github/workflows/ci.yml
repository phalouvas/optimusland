name: CI

on:
  pull_request:
    branches: [version-16, main]
  push:
    branches: [version-16]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: test_root
          MARIADB_DATABASE: test_site
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget libffi-dev libssl-dev wkhtmltopdf
          npm install -g yarn

      - name: Install Bench
        run: |
          pip install frappe-bench

      - name: Init Bench
        run: |
          bench init --skip-redis-config-generation --frappe-branch version-16 frappe-bench --python 3.14
          cd frappe-bench
          python -c "
          import json
          with open('sites/common_site_config.json') as f:
              config = json.load(f)
          config['redis_cache'] = 'redis://127.0.0.1:6379'
          config['redis_queue'] = 'redis://127.0.0.1:6379'
          config['redis_socketio'] = 'redis://127.0.0.1:6379'
          with open('sites/common_site_config.json', 'w') as f:
              json.dump(config, f, indent=2)
          print('Redis config written to common_site_config.json')
          "

      - name: Clone ERPNext
        run: |
          cd frappe-bench
          bench get-app --branch version-16 erpnext

      - name: Install App
        run: |
          cd frappe-bench
          bench get-app optimusland ${{ github.workspace }}

      - name: Create Site & Install Apps
        run: |
          cd frappe-bench
          bench new-site --mariadb-root-password test_root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app optimusland
          bench --site test_site set-config allow_tests true

      - name: Run ERPNext Setup Wizard
        run: |
          cd frappe-bench
          bench --site test_site execute erpnext.setup.setup_wizard.setup_wizard.setup_complete \
            --kwargs "{'args': frappe._dict({'company_name': 'Optimus Land', 'country': 'Greece', 'currency': 'EUR', 'chart_of_accounts': 'Standard', 'domain': 'Services', 'company_abbr': 'OL', 'fy_start_date': '2026-01-01', 'fy_end_date': '2026-12-31', 'setup_demo': False})}"

      - name: Run Tests
        run: |
          cd frappe-bench
          bench --site test_site run-tests --app optimusland
